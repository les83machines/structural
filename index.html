 {a:[-205,125,155],b:[-75,125,155],w:27},{a:[-75,125,155],b:[-75,0,30],w:27},
 {a:[-15,0,30],b:[85,0,30],w:26},{a:[85,0,30],b:[85,145,-115],w:26},
 {a:[85,145,-175],b:[-45,145,-175],w:25},{a:[-45,145,-175],b:[-45,30,-290],w:25},
 {a:[10,30,-290],b:[120,30,-290],w:25},{a:[120,30,-290],b:[120,165,-425],w:24},
 {a:[120,165,-485],b:[-10,165,-485],w:24},{a:[-10,165,-485],b:[-10,45,-605],w:24},
 {a:[45,45,-605],b:[165,45,-605],w:23},{a:[165,45,-605],b:[165,130,-710],w:23},
 {a:[165,130,-770],b:[260,130,-770],w:23}
];
const levelNine=[
 {a:[-320,0,0],b:[-215,0,0],w:28},{a:[-215,0,0],b:[-215,130,130],w:26},
 {a:[-215,130,130],b:[-85,130,130],w:26},{a:[-85,130,130],b:[-85,-25,0],w:26},
 {a:[-25,-25,0],b:[75,-25,0],w:25},{a:[75,-25,0],b:[75,115,-140],w:25},
 {a:[135,115,-140],b:[5,115,-140],w:25},{a:[5,115,-140],b:[5,10,-245],w:24},
 {a:[65,10,-245],b:[165,10,-245],w:24},{a:[165,10,-245],b:[165,155,-390],w:24},
 {a:[225,155,-450],b:[95,155,-450],w:23},{a:[95,155,-450],b:[95,35,-570],w:23},
 {a:[155,35,-570],b:[255,35,-570],w:23},{a:[255,35,-570],b:[255,145,-680],w:22},
 {a:[315,145,-740],b:[420,145,-740],w:22}
];
const levelTen=[
 {a:[-340,0,20],b:[-230,0,20],w:28},{a:[-230,0,20],b:[-230,140,160],w:26},
 {a:[-230,140,160],b:[-100,140,160],w:26},{a:[-100,140,160],b:[-100,-30,0],w:26},
 {a:[-35,-30,0],b:[65,-30,0],w:25},{a:[65,-30,0],b:[65,130,-160],w:25},
 {a:[125,130,-220],b:[-5,130,-220],w:24},{a:[-5,130,-220],b:[-5,0,-350],w:24},
 {a:[55,0,-410],b:[165,0,-410],w:24},{a:[165,0,-410],b:[165,160,-570],w:23},
 {a:[225,160,-630],b:[95,160,-630],w:23},{a:[95,160,-630],b:[95,20,-770],w:23},
 {a:[155,20,-830],b:[275,20,-830],w:22},{a:[275,20,-830],b:[275,150,-960],w:22},
 {a:[335,150,-1020],b:[465,150,-1020],w:22}
];
const levels=[levelOne,levelTwo,levelThree,levelFour,levelFive,levelSix,levelSeven,levelEight,levelNine,levelTen];
let segs=levelOne;
let goal={x:245,y:95,z:-55};
function loadLevel(n){
  level=n;
  segs=levels[n-1];
  const last=segs[segs.length-1].b;
  goal={x:last[0],y:last[1],z:last[2]};
  player={seg:0,t:0,fall:0,transition:null,visited:[0],endpointWait:0};
  trail.length=0;
  // Randomize the camera, but reject views that already solve the first
  // endpoint connection. The ball always begins at t=0 on the first path.
  for(let attempt=0;attempt<100;attempt++){
    angle=(Math.random()*2-1)*Math.PI;
    pitch=(Math.random()*2-1)*0.42;
    const endpoint=segs[0].b;
    const screenEnd=project([endpoint[0],endpoint[1]+15,endpoint[2]]);
    let alreadySolved=false;
    for(let i=1;i<segs.length;i++){
      const start=segs[i].a;
      const screenStart=project([start[0],start[1]+15,start[2]]);
      if(Math.hypot(screenEnd.x-screenStart.x,screenEnd.y-screenStart.y)<=26*scale){
        alreadySolved=true;break;
      }
    }
    if(!alreadySolved)break;
  }
  won=false;
  document.querySelector('#ui h1').textContent='STRUCTURAL / 0'+n;
  status.textContent='LEVEL '+n+' · H 0° · V 0°';
}

function rot3(p){
  const a=angle,b=pitch;
  let x=p[0],y=p[1],z=p[2];

  // Horizontal mouse movement rotates around the vertical axis.
  const x1=x*Math.cos(a)-z*Math.sin(a);
  const z1=x*Math.sin(a)+z*Math.cos(a);

  // Vertical mouse movement tilts the camera up/down.
  const y2=y*Math.cos(b)-z1*Math.sin(b);
  const z2=y*Math.sin(b)+z1*Math.cos(b);

  return [x1,y2,z2];
}

function project(p){
  const q=rot3(p);
  const depth=1+q[2]/900;
  return {
    x:cx+q[0]*scale/depth,
    y:cy-q[1]*scale/depth-q[2]*.18*scale,
    d:q[2]
  };
}

function line(a,b,width,fill='#111'){
  const A=project(a),B=project(b);
  ctx.strokeStyle=fill;ctx.lineWidth=width*scale;ctx.lineCap='butt';
  ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();
}

function drawSeg(s){
  const A=project(s.a),B=project(s.b);
  line(s.a,s.b,s.w);
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.arc(A.x,A.y,s.w*scale/2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(B.x,B.y,s.w*scale/2,0,Math.PI*2);ctx.fill();
}

function isAligned(){
  const A=project([70,0,30]);
  const B=project([20,95,75]);
  return Math.hypot(A.x-B.x,A.y-B.y)<48*scale;
}

function blendHex(a,b,t){
  const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);
  const r=Math.round(((A>>16)&255)*(1-t)+((B>>16)&255)*t);
  const g=Math.round(((A>>8)&255)*(1-t)+((B>>8)&255)*t);
  const bl=Math.round((A&255)*(1-t)+(B&255)*t);
  return 'rgb('+r+','+g+','+bl+')';
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#d3d3d3';ctx.fillRect(0,0,W,H);
  // Clean light-gray background keeps the paths and chromatic trail readable.

  ctx.strokeStyle='rgba(0,0,0,.07)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,cy+190*scale);ctx.lineTo(W,cy+190*scale);ctx.stroke();

  [...segs].sort((a,b)=>
    ((b.a[2]+b.b[2])/2)-((a.a[2]+a.b[2])/2)
  ).forEach(drawSeg);

  const g=project([goal.x,goal.y,goal.z]);
  ctx.strokeStyle='#111';ctx.lineWidth=3*scale;
  ctx.beginPath();ctx.arc(g.x,g.y,13*scale,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(g.x,g.y,6*scale,0,Math.PI*2);ctx.fill();

  const s=segs[Math.min(player.seg,segs.length-1)];
  const t=player.t;
  let p=won
    ? [goal.x,goal.y+15,goal.z]
    : [
        s.a[0]+(s.b[0]-s.a[0])*t,
        s.a[1]+(s.b[1]-s.a[1])*t+15,
        s.a[2]+(s.b[2]-s.a[2])*t
      ];
  if(player.transition){
    const tr=player.transition;
    const u=Math.min(1,tr.elapsed/tr.duration);
    // Smoothstep eases the ball through the apparent perspective connection.
    const eased=u*u*(3-2*u);
    p=[
      tr.from[0]+(tr.to[0]-tr.from[0])*eased,
      tr.from[1]+(tr.to[1]-tr.from[1])*eased+15,
      tr.from[2]+(tr.to[2]-tr.from[2])*eased
    ];
  }
  ballWorldPosition=p.slice();
  const pp=project(p);

  // Keep a short screen-space history and render it as a color-ramp trail.
  if(player.fall<=0){
    trail.push({x:pp.x,y:pp.y});
    // Trail remains visible for the entire level; cleared only on restart.
  }
  if(trail.length>1){
    const ramp=['#080018','#2400ff','#005dff','#00d9ff','#f5ff00','#ff2600','#ff00b8','#050014'];
    for(let i=1;i<trail.length;i++){
      const a=trail[i-1],b=trail[i];
      const t=i/(trail.length-1);
      const scaled=t*(ramp.length-1),idx=Math.min(ramp.length-2,Math.floor(scaled));
      const mix=scaled-idx;
      const color=blendHex(ramp[idx],ramp[idx+1],mix);
      ctx.strokeStyle=color;
      ctx.globalAlpha=.28+.72*t;
      ctx.lineWidth=(12+24*t)*scale;
      ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  if(player.fall>0){
    ctx.globalAlpha=Math.max(0,1-player.fall);
    pp.y+=player.fall*120*scale;
  }
  ctx.fillStyle='#fff';ctx.strokeStyle='#111';ctx.lineWidth=3*scale;
  ctx.beginPath();ctx.arc(pp.x,pp.y,9*scale,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.globalAlpha=1;

  const hd=((angle%(Math.PI*2)+Math.PI*2)%(Math.PI*2))*180/Math.PI;
  status.textContent='LEVEL '+level+' · H '+Math.round(hd)+'° · V '+Math.round(pitch*180/Math.PI)+'°';
}

let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.04);last=now;
  if(!won && !paused){
    if(player.fall>0){
      player.fall+=dt*2.2;
      if(player.fall>=1)resetPlayer();
    }else updatePlayer(dt);
  }
  draw();requestAnimationFrame(loop);
}

function resetPlayer(){player={seg:0,t:0,fall:0,transition:null,visited:[0],endpointWait:0};trail.length=0;}

function updatePlayer(dt){
  // While the ball is bridging a connection, finish that smooth transition first.
  if(player.transition){
    player.transition.elapsed+=dt;
    if(player.transition.elapsed>=player.transition.duration){
      player.transition=null;
    }
    return;
  }

  // Move along the current line. At its endpoint, wait until the player
  // rotates the camera enough for another line to visually align.
  if(player.t<1){
    player.t=Math.min(1,player.t+.46*dt);
    if(player.t<1)return;
  }

  const currentIndex=player.seg;
  const current=segs[currentIndex];
  const endpoint=current.b.slice();

  // Reaching the authored goal endpoint completes this level directly.
  // This must happen before searching for another aligned line, since the goal
  // is intentionally a terminal point and has no outgoing connection.
  const atGoal=Math.hypot(
    endpoint[0]-goal.x,
    endpoint[1]-goal.y,
    endpoint[2]-goal.z
  )<0.001;
  if(atGoal){
    if(!player.visited.includes(currentIndex))player.visited.push(currentIndex);
    won=true;
    document.querySelector('#win h2').textContent='LEVEL '+String(level).padStart(2,'0')+' COMPLETE';
    document.querySelector('#win p').textContent=level<10
      ? 'Level complete. Ready for the next structure?'
      : 'All ten structures complete. Excellent work.';
    document.getElementById('again').textContent=level<10?'NEXT LEVEL':'PLAY AGAIN';
    win.style.display='flex';
    return;
  }

  // Check every unvisited line start against the current endpoint in screen space.
  // No fallback connection: if nothing is aligned, the ball stays at the endpoint.
  const screenEnd=project([endpoint[0],endpoint[1]+15,endpoint[2]]);
  let bestIndex=-1,bestDistance=Infinity;
  const tolerance=26*scale;
  for(let i=0;i<segs.length;i++){
    if(player.visited.includes(i))continue;
    const start=segs[i].a;
    const screenStart=project([start[0],start[1]+15,start[2]]);
    const distance=Math.hypot(screenEnd.x-screenStart.x,screenEnd.y-screenStart.y);
    if(distance<=tolerance && distance<bestDistance){
      bestDistance=distance;
      bestIndex=i;
    }
  }

  // Keep the current segment occupied while waiting for a valid perspective fit.
  if(bestIndex<0){
    // Gravity stages (levels 9–10): if the endpoint remains unaligned,
    // the ball slips off the path and falls back to the level's start.
    if(level>=9){
      player.endpointWait=(player.endpointWait||0)+0.016;
      if(player.endpointWait>=1.8)player.fall=0.01;
    }
    return;
  }
  player.endpointWait=0;

  if(!player.visited.includes(currentIndex))player.visited.push(currentIndex);

  // All lines completed: progress to the next level, or show the final completion.
  if(player.visited.length>=segs.length){
    if(level===1){
      loadLevel(2);
      return;
    }
    player.seg=segs.length-1;
    player.t=1;
    won=true;
    document.querySelector('#win h2').textContent='LEVEL 02 COMPLETE';
    document.querySelector('#win p').textContent='You reached the final goal.';
    win.style.display='flex';
    return;
  }

  player.seg=bestIndex;
  player.t=0;
  player.transition={
    from:endpoint,
    to:segs[bestIndex].a.slice(),
    elapsed:0,
    duration:.32
  };
}

function rotate(delta){
  angle+=delta;
  if(angle>Math.PI*2)angle-=Math.PI*2;
  if(angle<-Math.PI*2)angle+=Math.PI*2;
}

function tilt(delta){
  pitch=Math.max(-1.15,Math.min(1.15,pitch+delta));
}

canvas.addEventListener('pointerdown',e=>{
  drag=true;lastX=e.clientX;lastY=e.clientY;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove',e=>{
  if(!drag||paused||won)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  lastX=e.clientX;lastY=e.clientY;
  rotate(dx*.008);
  tilt(-dy*.006);
});

canvas.addEventListener('pointerup',()=>{
  drag=false;canvas.classList.remove('dragging');
});
canvas.addEventListener('pointercancel',()=>{
  drag=false;canvas.classList.remove('dragging');
});

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='p'||k==='escape'){togglePause();return;}
  if(paused||won)return;
  if(e.key==='ArrowLeft'||k==='a')rotate(-.12);
  if(e.key==='ArrowRight'||k==='d')rotate(.12);
  if(e.key==='ArrowUp'||k==='w')tilt(.10);
  if(e.key==='ArrowDown'||k==='s')tilt(-.10);
  if(k==='r'){resetPlayer();won=false;win.style.display='none';}
});

document.getElementById('again').onclick=()=>{
  win.style.display='none';
  const next=level<10?level+1:1;
  document.querySelector('#win h2').textContent='LEVEL COMPLETE';
  document.querySelector('#win p').textContent='The path was created by perspective.';
  loadLevel(next);
  won=false;
};

function togglePause(){
  if(won)return;
  paused=!paused;
  // Pause is silent: freeze gameplay without showing a modal or message.
  document.getElementById('pauseBtn').textContent=paused?'RESUME':'PAUSE';
}
document.getElementById('pauseBtn').onclick=togglePause;
document.getElementById('exportBtn').onclick=()=>{
  // Export a snapshot with Structural's minimalist HUD over the gameplay image.
  const shot=document.createElement('canvas');
  shot.width=canvas.width;shot.height=canvas.height;
  const shotCtx=shot.getContext('2d');
  shotCtx.drawImage(canvas,0,0);
  shotCtx.save();
  shotCtx.scale(DPR,DPR);
  shotCtx.fillStyle='#111';
  shotCtx.textBaseline='top';

  // Game title and level indicator, styled like the on-screen UI.
  shotCtx.font='700 18px Arial, sans-serif';
  shotCtx.letterSpacing='2.8px';
  shotCtx.fillText('STRUCTURAL',24,24);
  shotCtx.font='11px Arial, sans-serif';
  shotCtx.letterSpacing='1.5px';
  shotCtx.globalAlpha=.62;
  shotCtx.fillText('LEVEL '+String(level).padStart(2,'0')+' / 10',24,52);

  // Ball world-space position readout, with a small UI divider.
  const coords=ballWorldPosition.map(v=>Math.round(v));
  const readout='BALL POSITION   X '+coords[0]+'   Y '+coords[1]+'   Z '+coords[2];
  shotCtx.globalAlpha=.72;
  shotCtx.font='11px Arial, sans-serif';
  shotCtx.letterSpacing='1.2px';
  const textWidth=shotCtx.measureText(readout).width;
  const rx=Math.max(24,W-textWidth-24);
  shotCtx.fillText(readout,rx,H-34);
  shotCtx.globalAlpha=.48;
  shotCtx.font='10px Arial, sans-serif';
  shotCtx.letterSpacing='1px';
  shotCtx.fillText('CREATED BY LES83MACHINES.COM',rx,H-16);
  shotCtx.globalAlpha=.28;
  shotCtx.fillRect(rx,H-50,Math.max(textWidth,shotCtx.measureText('CREATED BY LES83MACHINES.COM').width),1);
  shotCtx.restore();

  const jpg=shot.toDataURL('image/jpeg',0.94);
  const link=document.createElement('a');
  link.href=jpg;
  link.download='structural-level-'+String(level).padStart(2,'0')+'.jpg';
  document.body.appendChild(link);
  link.click();
  link.remove();
};

requestAnimationFrame(loop);
})();
</script>
